name: Portfolio Quality, Drift Gates & Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-deploy:
    name: Build, Redaction Check, HTML Validate, Lighthouse & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium with system dependencies for build-time Mermaid rendering
        run: pnpm exec playwright install --with-deps chromium

      - name: Astro Typecheck & Production Build
        run: pnpm run build

      - name: Security Redaction Gate (Block leaked internal ports or exact step-up timers)
        run: |
          if grep -rnE "(:3500|:3005|:3501|:8080|maxAgeSeconds: 180|180s/300s)" dist/; then
            echo "❌ Security Redaction Gate failed: Internal ports or exact security timers found in public build output."
            exit 1
          fi
          echo "✅ Security Redaction Gate passed."

      - name: Validate Generated HTML
        run: pnpm run check:html

      - name: Check Internal Links (Lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline --root-dir dist './dist/**/*.html'
          fail: true

      - name: Run Lighthouse CI (Target 95+ All Categories)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Deploy to Cloudflare Workers Static Assets
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
